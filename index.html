<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خطوات نحو التميز | نسخة المعلمات</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
:root{--navy:#194c8e;--blue:#1789d7;--gold:#ffd253;--green:#22aa78}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:#bcecff;color:#174c86}.app{max-width:1100px;min-height:100vh;margin:auto;background:#eafaff;box-shadow:0 0 45px #2a76a844;overflow:hidden}.top{background:linear-gradient(100deg,#1971c2,#42c0f4);border-bottom:5px solid #fff;box-shadow:0 4px 0 #2d95ce66;color:white;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:8px}.top h1{margin:0;font-size:clamp(19px,3vw,28px);text-shadow:1px 3px #14528b}.btn{font:900 16px Cairo,Tahoma,sans-serif;border:3px solid #fff;border-radius:19px;padding:10px 22px;box-shadow:0 6px 0 #145c9d55,0 9px 15px #0b50792e;cursor:pointer;transition:transform .16s,filter .16s}.btn:hover,.card:hover,.student:hover,.skill:hover,.bitem:hover{transform:translateY(-3px);filter:brightness(1.04)}.btn:active{transform:translateY(3px)}.blue{background:linear-gradient(#6cd7ff,#168ddd);color:white}.green{background:linear-gradient(#75ebaf,#21a86b);color:white}.yellow{background:linear-gradient(#fff1a0,#ffcb46);color:#815100}.red{background:#ff7078;color:white}.pale{background:linear-gradient(#fff,#e0f3ff);color:#165b99}.wrap{padding:20px;max-width:960px;margin:auto;position:relative}.center{text-align:center}.cover,.landing{min-height:calc(100vh - 118px);position:relative;isolation:isolate;overflow:hidden;text-align:center;padding:25px 18px 90px;background:linear-gradient(#80d7ff 0%,#c4efff 55%,#e7f6c8 56%,#a3d981 100%)}.cover:before,.landing:before{content:'';position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse 32% 15% at 15% 90%,#68c779 97%,transparent 100%),radial-gradient(ellipse 36% 19% at 85% 90%,#7bcf72 97%,transparent 100%),radial-gradient(ellipse 60% 17% at 50% 103%,#62b960 98%,transparent 100%)}.cloud{position:absolute;width:145px;height:45px;background:#fff;border-radius:40px;opacity:.93;filter:drop-shadow(0 5px 1px #6dbbdc44);z-index:-1}.cloud:before{content:'';position:absolute;width:72px;height:65px;background:white;border-radius:50%;bottom:10px;left:24px}.cloud:after{content:'';position:absolute;width:58px;height:55px;background:white;border-radius:50%;bottom:5px;right:18px}.c1{top:12%;left:5%}.c2{top:19%;right:4%;transform:scale(.75)}.sun{position:absolute;top:5%;right:17%;width:80px;height:80px;background:#ffe77d;border:7px solid #fff4a8;border-radius:50%;box-shadow:0 0 0 12px #fff2aa66;z-index:-1}.tree{position:absolute;bottom:7%;width:90px;height:190px;z-index:-1}.tree:before{content:'';position:absolute;bottom:0;left:40px;width:19px;height:110px;background:#b97948;border-radius:10px}.tree:after{content:'';position:absolute;top:0;left:0;width:95px;height:105px;border-radius:50%;background:radial-gradient(circle at 30% 35%,#b1ed79 0 16%,transparent 17%),radial-gradient(circle at 65% 32%,#6ccf66 0 29%,transparent 30%),#39a85d;border:5px solid #2c9955;box-shadow:inset 0 -13px #268a52}.t1{left:2%}.t2{right:2%;transform:scale(.85)}.flowers{position:absolute;bottom:5px;left:0;right:0;font-size:28px;letter-spacing:8px;z-index:-1;white-space:nowrap;overflow:hidden}.school{font-size:clamp(13px,2vw,18px);font-weight:900;color:#174c86;text-shadow:0 2px white}.cover h1{font-size:clamp(32px,6vw,60px);line-height:1.5;color:#1951a1;text-shadow:2px 3px #fff,4px 6px #ffcc56;margin:4px 0;font-weight:900}.coverbox{max-width:600px;margin:10px auto 22px;background:#fffcf1f2;border:5px solid white;border-radius:32px;padding:18px;box-shadow:0 9px 0 #398abf66,0 15px 20px #2074a833}.coverbox h2{margin:5px}.coverbox p{margin:8px}.scene{font-size:clamp(48px,8vw,85px);filter:drop-shadow(0 7px 2px #267a5055)}.wood{display:inline-block;background:linear-gradient(#eab76d,#c9873b);color:#fff;border:5px solid #fff1d4;border-radius:18px;box-shadow:0 7px 0 #93592e;text-shadow:1px 2px #90531e;padding:8px 24px;font-size:clamp(18px,3vw,30px)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;max-width:870px;margin:25px auto}.card{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;border-radius:34px;padding:20px;cursor:pointer;border:6px solid white;box-shadow:0 10px 0 #1c74aa66,0 16px 24px #267aa633;transition:.15s}.card h2{margin:8px 0 0;font-size:clamp(22px,3vw,30px);color:#17558b}.card p{margin:2px}.academic{background:linear-gradient(#e9f9ff,#7dd2ff)}.behavior{background:linear-gradient(#f1ffec,#92e9b1)}.card .emoji{font-size:clamp(65px,9vw,95px);filter:drop-shadow(0 6px 2px #174c8640)}.goal{max-width:770px;margin:15px auto;background:#fffdf3f2;border:5px solid white;border-radius:25px;padding:16px;box-shadow:0 7px 0 #489ac566}.goal h2{margin:0}.panel{background:#fffefa;border:4px solid #fff;border-radius:27px;padding:20px;box-shadow:0 6px 0 #84c8e1,0 12px 20px #16699922;margin:18px 0}.label{display:block;font-weight:900;margin-bottom:12px}.students{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.student{font:800 14px Cairo,Tahoma,sans-serif;border:3px solid #d0e9f8;background:linear-gradient(#fff,#e9f6ff);border-radius:18px;padding:8px 3px;cursor:pointer;color:#175087;box-shadow:0 4px 0 #9acde6;transition:.15s}.student:before{content:'👦🏻';display:block;font-size:28px}.student:nth-child(6):before,.student:nth-child(9):before,.student:nth-child(11):before,.student:nth-child(13):before{content:'👧🏻'}.student.active{background:#fff0a9;border-color:#ffbc48;box-shadow:0 4px 0 #e9a93b}.progress{height:20px;background:#e1edf2;border:3px solid white;border-radius:20px;overflow:hidden;margin:10px 0;box-shadow:inset 0 2px 4px #7795a455}.bar{height:100%;background:linear-gradient(90deg,#2bb78a,#a2e77e);transition:width .3s}.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.skill{display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(#fff,#edf8ff);border:2px solid #d7eaf8;border-radius:15px;padding:12px;font:700 13px Cairo,Tahoma,sans-serif;text-align:right;color:#175087;cursor:pointer;transition:.15s}.skill.active{border-color:#2b9de0;background:#d6f0ff}.tag{padding:5px 7px;border-radius:10px;background:#e3ebf1;white-space:nowrap;font-size:11px}.tag.yes{background:#b8f3d1;color:#13734b}.tag.no{background:#fff0c3;color:#9d691a}.actionrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.actionrow .btn{flex:1;min-width:130px}.subhero{background:linear-gradient(100deg,#1e91d8,#77d7f9);border:5px solid white;border-radius:28px;color:white;text-align:center;padding:12px;box-shadow:0 7px 0 #258ac0;text-shadow:1px 2px #1973a9}.subhero h2{margin:0}.map{height:410px;max-width:800px;margin:15px auto;position:relative;overflow:hidden;border:7px solid white;border-radius:30px;background:linear-gradient(#84d9ff 0%,#d8f6ff 51%,#b8e899 52%,#62c57e 100%);box-shadow:0 8px 0 #53a98c}.map:before{content:'☁️           ☀️           ☁️';position:absolute;top:6px;left:0;right:0;font-size:30px}.map:after{content:'🌳     🌷    🌼     🌲     🌻     🏰';position:absolute;bottom:0;left:0;right:0;font-size:37px}.road{position:absolute;inset:40px 15px 20px;width:calc(100% - 30px);height:calc(100% - 60px)}.stop{position:absolute;transform:translate(-50%,-50%);width:59px;height:59px;display:grid;place-items:center;border-radius:50%;border:4px solid white;background:linear-gradient(#fff09a,#ffc84d);box-shadow:0 5px 0 #bb8a3e,0 8px 12px #0002;font-weight:900;color:#855c10;direction:ltr}.stop.locked{background:#d8e5e8;color:#6a8490;box-shadow:0 5px 0 #9baeb5}.stop.current{background:linear-gradient(#8ff9b4,#23b47c);color:white;animation:pulse 1.5s infinite}@keyframes pulse{50%{box-shadow:0 0 0 12px #4ddbb866}}.behaviors{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.bitem{border:3px solid #d6e7ec;border-radius:22px;background:linear-gradient(#fff,#f1faff);padding:14px 6px;color:#21547c;font:800 13px Cairo,Tahoma,sans-serif;cursor:pointer;transition:.15s}.bitem.active{border-color:#26b178;background:#e5fbed}.bitem .em{display:block;font-size:37px}.notice{background:#fff1b9;border:3px solid #f6c65b;border-radius:18px;padding:14px;font-weight:900;text-align:center}.foot{background:#d9f4ff;text-align:center;padding:14px;color:#547a97;font-size:12px}.hide{display:none!important}@media(max-width:650px){.cards{grid-template-columns:1fr;gap:14px}.card{min-height:210px}.students{grid-template-columns:repeat(3,1fr)}.behaviors{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}.map{height:310px}.stop{width:45px;height:45px;font-size:12px}.tree{transform:scale(.6);transform-origin:bottom}.cover h1{font-size:33px}.cover{padding:15px 12px 80px}.scene{font-size:50px}.cloud{transform:scale(.6)}}@media print{.top,.btn,.foot,.actionrow{display:none!important}body{background:white}.app{box-shadow:none}.panel{break-inside:avoid}}
.settingsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.field{width:100%;padding:11px;border:2px solid #b6dcf0;border-radius:12px;font:700 15px Cairo,Tahoma,sans-serif;margin:5px 0 12px}.editline{display:flex;gap:7px;align-items:center;margin:7px 0}.editline .field{margin:0;min-width:0}.tiny{font-size:12px;color:#526b7a}.credit{font-weight:700;font-size:11px;line-height:1.8}.settingbtn{margin:10px auto}.settingspanel h3{color:#165b99}.settingspanel .btn{font-size:13px;padding:7px 12px;border-width:2px}.settingspanel .red{background:#ff7777}.settingspanel .editline .btn{flex-shrink:0}@media(max-width:650px){.editline{flex-wrap:wrap}.editline .field{flex-basis:100%}}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1971c2"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="icon-192.png"></head><body><div class="app"><header class="top"><button id="back" class="btn pale hide" onclick="back()">↩ رجوع</button><h1 id="heading">🏆 خطوات نحو التميز</h1><span>⭐</span></header><main id="view"></main><footer class="foot"><div class="credit">إعداد وتنفيذ معلمة صعوبات تعلم رياضيات/ وصال الخنبشية</div></footer></div><script>
let students=['سالم','سعد','عمار','الميثم','سعود','آيات','نوح','محمد','ديما','الحسن','كذية','سراج','رزان','أيوب','جاسم'];
let skills=['قراءة وكتابة الأرقام (٠–٩)','ترتيب الأرقام (٠–٩)','مقارنة الأرقام','الجمع من منزلة واحدة','أزواج العدد ١٠','الطرح من منزلة واحدة','مثلث حقائق الجمع والطرح','الأعداد الزوجية والفردية','الضعف','النصف','قراءة وكتابة الأعداد حتى ٣٠','القيمة المكانية: الآحاد والعشرات','قراءة وكتابة الأعداد حتى ١٠٠','مقارنة الأعداد حتى ١٠٠','ترتيب الأعداد حتى ١٠٠','جمع الأعداد من منزلتين','طرح الأعداد من منزلتين','العد القفزي (٢، ٥، ١٠)','الضرب بالمجموعات والمصفوفات','الأكثر والأقل بواحد وعشرة','تقريب الأعداد لأقرب عشرة','قراءة وكتابة الأعداد حتى ٩٩٩','القيمة المكانية حتى المئات','الكسور والنصف والربع'];
const behaviors=[['focus','👀','الانتباه والتركيز'],['participate','🙋','المشاركة الإيجابية'],['complete','✅','إنجاز النشاط'],['respect','💗','الالتزام بالتعليمات']];
const key='khutuwat_teachers_v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{}}catch{data={}};let config={school:'',directorate:'',teacher:'',job:''};
try{const stored=JSON.parse(localStorage.getItem('khutuwat_teachers_settings_v1'));if(stored){config={...config,...stored.config};if(Array.isArray(stored.students))students=stored.students;if(Array.isArray(stored.skills))skills=stored.skills}}catch(e){}
let page='cover',student=students[0]||'',skillIndex=0,behavior='focus',notice='';
function saveSettings(){try{localStorage.setItem('khutuwat_teachers_settings_v1',JSON.stringify({config,students,skills}))}catch(e){alert('تعذر حفظ الإعدادات')}}
function fieldText(id){return document.getElementById(id)?.value.trim()||''}
function updateSchool(){config.school=fieldText('schoolField');config.directorate=fieldText('directorateField');config.teacher=fieldText('teacherField');config.job=fieldText('jobField');saveSettings();notice='تم حفظ بيانات المدرسة والمعلمة';render()}
function addStudent(){const n=fieldText('newStudent');if(!n)return alert('اكتبي اسم الطالب');if(students.includes(n))return alert('الاسم موجود بالفعل');students.push(n);student=n;saveSettings();render()}
function renameStudent(i){const n=fieldText('studentField'+i);if(!n)return alert('اسم الطالب لا يمكن أن يكون فارغًا');const old=students[i];if(n!==old&&students.includes(n))return alert('الاسم موجود بالفعل');if(n!==old){if(data[old]){data[n]=data[old];delete data[old];save()}students[i]=n;if(student===old)student=n;saveSettings()}render()}
function removeStudent(i){const n=students[i];if(!confirm('حذف '+n+' وسجلاته من هذه النسخة؟ صدّري نسخة احتياطية أولًا.'))return;students.splice(i,1);delete data[n];student=students[0]||'';save();saveSettings();render()}
function addSkill(){const n=fieldText('newSkill');if(!n)return alert('اكتبي اسم المهارة');skills.push(n);saveSettings();render()}
function renameSkill(i){const n=fieldText('skillField'+i);if(!n)return alert('اسم المهارة لا يمكن أن يكون فارغًا');skills[i]=n;saveSettings();render()}
function removeSkill(i){if(!confirm('حذف هذه المهارة وتقييماتها من سجلات الطلبة؟'))return;skills.splice(i,1);Object.values(data).forEach(r=>{const old=r.mastery||{};const newer={};Object.keys(old).forEach(k=>{const num=Number(k);if(num<i)newer[num]=old[k];else if(num>i)newer[num-1]=old[k]});r.mastery=newer});skillIndex=Math.max(0,Math.min(skillIndex,skills.length-1));save();saveSettings();render()}
function exportBackup(){const payload={version:1,kind:'khutuwat_teachers_backup',config,students,skills,data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='نسخة_احتياطية_خطوات_نحو_التميز_للمعلمات.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function importBackup(input){const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.kind!=='khutuwat_teachers_backup'||!Array.isArray(obj.students)||!Array.isArray(obj.skills)||!obj.config||typeof obj.data!=='object')throw Error('ملف غير صالح');if(!confirm('استعادة النسخة الاحتياطية ستستبدل بيانات هذه النسخة الحالية. متابعة؟'))return;students=obj.students.filter(x=>typeof x==='string');skills=obj.skills.filter(x=>typeof x==='string');config={...config,...obj.config};data=obj.data;student=students[0]||'';skillIndex=0;saveSettings();save();render();alert('تمت الاستعادة بنجاح')}catch(e){alert('تعذر استعادة الملف. تأكدي أنه نسخة احتياطية من برنامج المعلمات')}};reader.readAsText(file)}
function settings(){return `<div class="wrap settingspanel"><div class="subhero"><h2>⚙️ إعدادات نسخة المعلمات</h2><small>يمكن تخصيص بيانات البرنامج دون تعديل الكود</small></div><div class="panel"><h3>🏫 بيانات المدرسة والمعلمة</h3><div class="settingsgrid"><label>اسم المدرسة<input id="schoolField" class="field" value="${html(config.school)}"></label><label>المديرية التعليمية<input id="directorateField" class="field" value="${html(config.directorate)}"></label><label>اسم المعلمة المستخدمة للبرنامج<input id="teacherField" class="field" value="${html(config.teacher)}"></label><label>المسمى الوظيفي<input id="jobField" class="field" value="${html(config.job)}"></label></div><button class="btn green" onclick="updateSchool()">💾 حفظ البيانات</button></div><div class="panel"><h3>👧👦 إدارة الطلبة (${students.length})</h3>${students.map((n,i)=>`<div class="editline"><input class="field" id="studentField${i}" value="${html(n)}" aria-label="اسم الطالب"><button class="btn blue" onclick="renameStudent(${i})">حفظ</button><button class="btn red" onclick="removeStudent(${i})">حذف</button></div>`).join('')}<div class="editline"><input class="field" id="newStudent" placeholder="اسم طالب جديد"><button class="btn green" onclick="addStudent()">＋ إضافة طالب</button></div></div><div class="panel"><h3>📚 إدارة مهارات تحدي الحساب (${skills.length})</h3>${skills.map((n,i)=>`<div class="editline"><input class="field" id="skillField${i}" value="${html(n)}" aria-label="اسم المهارة"><button class="btn blue" onclick="renameSkill(${i})">حفظ</button><button class="btn red" onclick="removeSkill(${i})">حذف</button></div>`).join('')}<div class="editline"><input class="field" id="newSkill" placeholder="مهارة جديدة"><button class="btn green" onclick="addSkill()">＋ إضافة مهارة</button></div></div><div class="panel center"><h3>💾 النسخ الاحتياطي والاستعادة</h3><p class="tiny">تُحفظ بيانات كل معلمة على جهازها وفي متصفحها. يُنصح بتصدير نسخة احتياطية بانتظام.</p><div class="actionrow"><button class="btn blue" onclick="exportBackup()">تنزيل نسخة احتياطية كاملة JSON</button><label class="btn pale" for="backupInput">استعادة نسخة احتياطية</label><input id="backupInput" type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)"></div></div><p class="center tiny">إعداد وتنفيذ معلمة صعوبات تعلم رياضيات/ وصال الخنبشية</p></div>`}

function record(){if(!student)return {mastery:{},behavior:{},log:[]};if(!data[student])data[student]={mastery:{},behavior:{},log:[]};return data[student]}
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{alert('تعذر حفظ البيانات. صدّري نسخة احتياطية.') }}
function html(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(p){page=p;notice='';render();scrollTo(0,0)}function back(){go(page==='cover'?'cover':page==='home'||page==='settings'?'cover':'home')}
function choose(n){student=n;notice='';render()}function chooseIndex(i){choose(students[i])}function chooseSkill(i){skillIndex=i;render()}
function setMastery(v){const r=record();r.mastery[skillIndex]=v;r.log.push({date:new Date().toLocaleString('ar-OM'),type:'مهارة',item:skills[skillIndex],value:v==='yes'?'أتقن':'قيد التدريب'});save();render()}
function addStar(){const r=record();r.behavior[behavior]=(r.behavior[behavior]||0)+1;r.log.push({date:new Date().toLocaleString('ar-OM'),type:'سلوك',item:behaviors.find(b=>b[0]===behavior)[2],value:'+١ نجمة'});save();notice='🎉 أحسنت يا '+student+'! حصلت على نجمة جديدة!';render()}
function undoStar(){const r=record();if((r.behavior[behavior]||0)>0){r.behavior[behavior]--;r.log.push({date:new Date().toLocaleString('ar-OM'),type:'تصحيح',item:behaviors.find(b=>b[0]===behavior)[2],value:'إلغاء نجمة'});save();notice='';render()}}
function count(){return Object.values(record().behavior).reduce((a,b)=>a+b,0)}
function studentButtons(){return `<div class="panel"><span class="label">🧒 اختر اسم الطالب</span><div class="students">${students.map(n=>`<button class="student ${n===student?'active':''}" onclick="chooseIndex(${students.indexOf(n)})">${html(n)}</button>`).join('')}</div></div>`}
function cover(){return `<section class="cover"><span class="sun"></span><span class="cloud c1"></span><span class="cloud c2"></span><span class="tree t1"></span><span class="tree t2"></span><div class="school">${config.directorate?html(config.directorate)+"<br>":""}${config.school?html(config.school):""}</div><p>البرنامج التحفيزي التفاعلي</p><h1>⭐ خطوات نحو التميز ⭐</h1><strong>نتعلم • نتقدم • نتميز</strong><div class="coverbox"><h2>🏆 مرحبًا بأبطال التميز</h2><p>مغامرة تجمع بين تحدي الحساب وسُلّم التميز السلوكي</p>${config.teacher||config.job?`<hr><p>بيانات المعلمة</p><strong>${html(config.job)}${config.job&&config.teacher?"<br>":""}${html(config.teacher)}</strong>`:""}</div><button class="btn blue" onclick="go('home')">ابدأ رحلة التميز ←</button><div style="margin-top:16px"><button class="btn pale" onclick="go('settings')">⚙️ إعدادات المعلمة والبرنامج</button></div></section>`}
function home(){return `<div class="landing"><span class="sun"></span><span class="cloud c1"></span><span class="cloud c2"></span><span class="tree t1"></span><span class="tree t2"></span><span class="flowers">🌼 🌷 🌻 🌸 🌼 🌷 🌻 🌸</span><span class="floating treeleft">🌳</span><span class="floating treeright">🌳</span><div class="center"><h1 class="wood">🌟 مرحبًا بأبطالنا الأعزاء 🌟</h1><p>اختر المشروع الذي تريد البدء فيه</p></div><div class="cards"><div class="card academic" role="button" tabindex="0" onclick="go('academic')" onkeydown="if(event.key==='Enter')go('academic')"><div class="emoji">🔢 🧮</div><h2>تحدي الحساب</h2><p>المشروع الأكاديمي</p><strong>إتقان مهارات الرياضيات بالتدرج</strong><p>🔵 ابدأ التحدي ←</p></div><div class="card behavior" role="button" tabindex="0" onclick="go('behavior')" onkeydown="if(event.key==='Enter')go('behavior')"><div class="emoji">🏆 ⭐</div><h2>سُلّم التميز السلوكي</h2><p>المشروع السلوكي</p><strong>مغامرة النجوم والسلوك الإيجابي</strong><p>🟢 ابدأ المغامرة ←</p></div></div><div class="goal"><h2>🎯 هدفنا</h2>أن يحقق كل طالب تقدمًا في مهاراته الأكاديمية وسلوكياته الإيجابية وفق قدراته الفردية.</div><div class="center" style="margin-top:18px"><button class="btn pale" onclick="exportAll()">📥 تصدير نسخة احتياطية لجميع السجلات</button></div></div>`}
function academic(){const r=record(),done=Object.values(r.mastery).filter(v=>v==='yes').length;return `<div class="wrap"><div class="subhero"><h2>🧮 تحدي الحساب ⭐</h2><small>المشروع الأكاديمي</small></div>${studentButtons()}<div class="panel"><b>تقدم ${student} في المهارات: ${done} من ${skills.length}</b><div class="progress"><div class="bar" style="width:${skills.length?done/skills.length*100:0}%"></div></div><small>تُحدد حالة كل مهارة بحسب تقييم المعلمة وخطة الطالب الفردية.</small></div><div class="panel"><h3>📚 المهارات الرياضية بالتدرج</h3><div class="skills">${skills.map((s,i)=>{let v=r.mastery[i];return `<button class="skill ${skillIndex===i?'active':''}" onclick="chooseSkill(${i})"><span>${i+1}. ${s}</span><span class="tag ${v||''}">${v==='yes'?'✔ متقنة':v==='no'?'↻ تدريب':'○ لم تُقيّم'}</span></button>`}).join('')}</div></div><div class="panel center"><h3>${skills.length?'المهارة '+(skillIndex+1)+': '+html(skills[skillIndex]):'أضيفي مهارات من الإعدادات'}</h3><p>هل أتقن الطالب هذه المهارة؟</p><div class="actionrow"><button class="btn green" onclick="setMastery('yes')">✔ أتقن</button><button class="btn yellow" onclick="setMastery('no')">↻ قيد التدريب</button><button class="btn pale" onclick="chooseSkill(Math.min(${skills.length-1},skillIndex+1))">المهارة التالية ←</button></div></div><div class="actionrow"><button class="btn blue" onclick="exportStudent()">📄 تصدير سجل ${student}</button><button class="btn pale" onclick="window.print()">🖨 طباعة الصفحة</button></div></div>`}
function behaviorPage(){const r=record(),stars=count(),positions=[[10,78],[32,57],[19,30],[53,33],[74,56],[89,19]],level=Math.min(5,Math.floor(stars/5));return `<div class="wrap"><div class="subhero"><h2>🏆 سُلّم التميز السلوكي 🌟</h2><small>المشروع السلوكي</small></div>${studentButtons()}<div class="panel center"><h2>🧒 مغامرة البطل ${student}</h2><p>كل خمس نجوم تفتح محطة جديدة!</p><div class="map"><svg class="road" viewBox="0 0 600 300" preserveAspectRatio="none"><path d="M60 235 C200 260 220 150 115 90 S260 40 330 105 S430 200 450 170 S510 60 535 50" fill="none" stroke="#dcb877" stroke-width="32" stroke-linecap="round"/><path d="M60 235 C200 260 220 150 115 90 S260 40 330 105 S430 200 450 170 S510 60 535 50" fill="none" stroke="#fff6ce" stroke-width="3" stroke-dasharray="9 13"/></svg>${positions.map((p,i)=>`<div class="stop ${i>level?'locked':i===level?'current':''}" style="left:${p[0]}%;top:${p[1]}%">${i===5?'🏰':i===level?'⭐':i===0?'🚩':i*5}</div>`).join('')}</div><h2>⭐ مجموع النجوم: ${stars}</h2><p>${stars>=25?'🏰 وصلت إلى قلعة التميز!':`المحطة القادمة: ${Math.min(25,(Math.floor(stars/5)+1)*5)} نجوم`}</p></div><div class="panel"><h3>🌈 اختر السلوك الإيجابي الذي حققه الطالب</h3><div class="behaviors">${behaviors.map(b=>`<button class="bitem ${behavior===b[0]?'active':''}" onclick="behavior='${b[0]}';render()"><span class="em">${b[1]}</span>${b[2]}<br><small>⭐ ${r.behavior[b[0]]||0}</small></button>`).join('')}</div><p class="center"><button class="btn green" onclick="addStar()">⭐ امنح ${student} نجمة</button></p>${notice?`<div class="notice">${html(notice)}</div>`:''}<div class="actionrow"><button class="btn pale" onclick="undoStar()">↶ التراجع عن نجمة</button><button class="btn blue" onclick="exportStudent()">📄 تصدير سجل الطالب</button></div></div><div class="panel"><h3>🎁 محطات التعزيز</h3><p>⭐ ٥ نجوم: بطل الانتباه &nbsp; ⭐ ١٠ نجوم: بطل المشاركة</p><p>⭐ ١٥ نجمة: بطل الإنجاز &nbsp; ⭐ ٢٠ نجمة: بطل الالتزام</p><p>🏆 ٢٥ نجمة: الوصول إلى قلعة التميز!</p><small>يمكن للمعلمة تكييف عدد النجوم والسلوكيات المستهدفة حسب قدرات كل طالب. النجوم للتعزيز الإيجابي ولا تُستخدم للعقاب.</small></div></div>`}
function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}function download(name,rows){let csv='\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportStudent(){const r=record(),rows=[['الطالب','القسم','البند','الحالة / العدد'],...skills.map((s,i)=>[student,'تحدي الحساب',s,r.mastery[i]==='yes'?'أتقن':r.mastery[i]==='no'?'قيد التدريب':'لم يُقيّم']),...behaviors.map(b=>[student,'السلوك',b[2],r.behavior[b[0]]||0]),[],['التاريخ','النوع','البند','الإجراء'],...r.log.map(x=>[x.date,x.type,x.item,x.value])];download('سجل_'+student+'.csv',rows)}
function exportAll(){const rows=[['الطالب','القسم','البند','الحالة / العدد']];students.forEach(n=>{const r=data[n]||{mastery:{},behavior:{}};skills.forEach((s,i)=>rows.push([n,'تحدي الحساب',s,r.mastery?.[i]==='yes'?'أتقن':r.mastery?.[i]==='no'?'قيد التدريب':'لم يُقيّم']));behaviors.forEach(b=>rows.push([n,'السلوك',b[2],r.behavior?.[b[0]]||0]))});rows.push([],['الطالب','التاريخ','النوع','البند','الإجراء']);students.forEach(n=>(data[n]?.log||[]).forEach(x=>rows.push([n,x.date,x.type,x.item,x.value])));download('خطوات_نحو_التميز_جميع_الطلبة.csv',rows)}
function render(){document.getElementById('back').classList.toggle('hide',page==='cover');document.getElementById('heading').textContent=page==='academic'?'🧮 تحدي الحساب':page==='behavior'?'🏆 سُلّم التميز السلوكي':page==='settings'?'⚙️ الإعدادات':'🏆 خطوات نحو التميز';document.getElementById('view').innerHTML=page==='cover'?cover():page==='home'?home():page==='academic'?academic():page==='settings'?settings():behaviorPage()};render();
</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
